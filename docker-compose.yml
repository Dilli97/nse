version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nseapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_use_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-nse_analysis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nseapp} -d ${POSTGRES_DB:-nse_analysis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://nseapp:changeme_use_strong_password@db:5432/nse_analysis}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-yahoo}
      - SECRET_KEY=${SECRET_KEY:-changeme_generate_random_key}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker.scheduler
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://nseapp:changeme_use_strong_password@db:5432/nse_analysis}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-yahoo}
      - SECRET_KEY=${SECRET_KEY:-changeme_generate_random_key}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
